AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud-Based Smart Inventory Management API

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-zA-Z0-9_-]+$'
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Browser callback and origin allowed to use the application.
  CognitoDomainPrefix:
    Type: String
    MinLength: 1
    MaxLength: 63
    AllowedPattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    Description: Lowercase prefix unique within the deployment region for the Cognito domain.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 128
    Timeout: 5
    Environment:
      Variables:
        PRODUCTS_TABLE_NAME: !Ref ProductsTable

Resources:
  InventoryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
        MaxAge: 300
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${EmployeeUserPool}'
              audience:
                - !Ref EmployeeUserPoolClient
        DefaultAuthorizer: CognitoJwtAuthorizer

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-products'
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  EmployeeUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-employees'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      MfaConfiguration: OFF
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  EmployeeUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref EmployeeUserPool
      ClientName: !Sub '${AWS::StackName}-frontend'
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Ref FrontendOrigin
      LogoutURLs:
        - !Ref FrontendOrigin
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  EmployeeUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref EmployeeUserPool

  CreateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.createProduct
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ProductsTable.Arn
      Events:
        CreateProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref InventoryApi
            Path: /products
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda.ts
        Bundle: true
        Minify: true
        Target: es2022
        Format: esm

  ListProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.listProducts
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt ProductsTable.Arn
      Events:
        ListProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref InventoryApi
            Path: /products
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda.ts
        Bundle: true
        Minify: true
        Target: es2022
        Format: esm

  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.getProduct
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt ProductsTable.Arn
      Events:
        GetProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref InventoryApi
            Path: /products/{productId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda.ts
        Bundle: true
        Minify: true
        Target: es2022
        Format: esm

  UpdateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.updateProduct
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt ProductsTable.Arn
      Events:
        UpdateProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref InventoryApi
            Path: /products/{productId}
            Method: PUT
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda.ts
        Bundle: true
        Minify: true
        Target: es2022
        Format: esm

  DeleteProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.deleteProduct
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !GetAtt ProductsTable.Arn
      Events:
        DeleteProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref InventoryApi
            Path: /products/{productId}
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda.ts
        Bundle: true
        Minify: true
        Target: es2022
        Format: esm

Outputs:
  ApiBaseUrl:
    Description: Base URL for the product API.
    Value: !Sub 'https://${InventoryApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}'
  ProductsTableName:
    Description: DynamoDB product table name.
    Value: !Ref ProductsTable
  CognitoAuthority:
    Description: OIDC issuer for the employee user pool.
    Value: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${EmployeeUserPool}'
  CognitoClientId:
    Description: Public app client ID for the frontend.
    Value: !Ref EmployeeUserPoolClient
  CognitoDomain:
    Description: Cognito managed-login domain.
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
