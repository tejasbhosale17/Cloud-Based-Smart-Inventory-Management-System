AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud-Based Smart Inventory Management API

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-zA-Z0-9_-]+$'
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Local development origin; the CloudFront origin is added automatically.
    AllowedPattern: '^(https://[A-Za-z0-9.-]+(:[0-9]{1,5})?|http://(localhost|127\.0\.0\.1)(:[0-9]{1,5})?)$'
    ConstraintDescription: Use HTTPS for hosted origins; HTTP is allowed only for localhost.
  CognitoDomainPrefix:
    Type: String
    MinLength: 1
    MaxLength: 63
    AllowedPattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    Description: Lowercase prefix unique within the deployment region for the Cognito domain.
  LowStockEmailAddress:
    Type: String
    Default: ''
    Description: Optional email recipient; confirm the SNS subscription before alerts can be delivered.

Conditions:
  HasLowStockEmailAddress: !Not
    - !Equals
      - !Ref LowStockEmailAddress
      - ''

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 128
    Timeout: 5
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: INFO
    Environment:
      Variables:
        PRODUCTS_TABLE_NAME: !Ref ProductsTable
        SALES_TABLE_NAME: !Ref SalesTable

Resources:
  InventoryApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}-access'
      RetentionInDays: 7

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-frontend-cache'
        Comment: Cache static frontend content for five minutes by default.
        DefaultTTL: 300
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} frontend'
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: !Ref FrontendCachePolicy
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  InventoryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: Cloud-Based Smart Inventory API
          version: '1.0'
        paths: {}
      AccessLogSettings:
        DestinationArn: !GetAtt InventoryApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength"}'
      CorsConfiguration:
        AllowOrigins: !Split
          - ','
          - !Sub '${FrontendOrigin},https://${FrontendDistribution.DomainName}'
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
        MaxAge: 300
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${EmployeeUserPool}'
              audience:
                - !Ref EmployeeUserPoolClient
        DefaultAuthorizer: CognitoJwtAuthorizer

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-products'
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      StreamSpecification: !If
        - HasLowStockEmailAddress
        - StreamViewType: NEW_AND_OLD_IMAGES
        - !Ref AWS::NoValue
      SSESpecification:
        SSEEnabled: true

  SalesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-sales'
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: saleId
          AttributeType: S
      KeySchema:
        - AttributeName: saleId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  EmployeeUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-employees'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      MfaConfiguration: OFF
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  EmployeeUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref EmployeeUserPool
      ClientName: !Sub '${AWS::StackName}-frontend'
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Ref FrontendOrigin
        - !Sub 'https://${FrontendDistribution.DomainName}'
      LogoutURLs:
        - !Ref FrontendOrigin
        - !Sub 'https://${FrontendDistribution.DomainName}'
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  EmployeeUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref EmployeeUserPool

  LowStockTopic:
    Type: AWS::SNS::Topic
    Condition: HasLowStockEmailAddress
    Properties:
      TopicName: !Sub '${AWS::StackName}-low-stock'

  LowStockEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasLowStockEmailAddress
    Properties:
      Protocol: email
      TopicArn: !Ref LowStockTopic
      Endpoint: !Ref LowStockEmailAddress

  CreateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.createProduct
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ProductsTable.Arn
      Events:
        CreateProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref InventoryApi
            Path: /products
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda.ts
        Bundle: true
        Minify: true
        Target: es2022
        Format: esm

  ListProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.listProducts
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt ProductsTable.Arn
      Events:
        ListProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref InventoryApi
            Path: /products
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda.ts
        Bundle: true
        Minify: true
        Target: es2022
        Format: esm

  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.getProduct
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt ProductsTable.Arn
      Events:
        GetProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref InventoryApi
            Path: /products/{productId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda.ts
        Bundle: true
        Minify: true
        Target: es2022
        Format: esm

  UpdateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.updateProduct
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt ProductsTable.Arn
      Events:
        UpdateProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref InventoryApi
            Path: /products/{productId}
            Method: PUT
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda.ts
        Bundle: true
        Minify: true
        Target: es2022
        Format: esm

  DeleteProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.deleteProduct
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !GetAtt ProductsTable.Arn
      Events:
        DeleteProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref InventoryApi
            Path: /products/{productId}
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda.ts
        Bundle: true
        Minify: true
        Target: es2022
        Format: esm

  CreateSaleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda.createSale
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt ProductsTable.Arn
                - !GetAtt SalesTable.Arn
      Events:
        CreateSale:
          Type: HttpApi
          Properties:
            ApiId: !Ref InventoryApi
            Path: /sales
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda.ts
        Bundle: true
        Minify: true
        Target: es2022
        Format: esm

  LowStockNotificationFunction:
    Type: AWS::Serverless::Function
    Condition: HasLowStockEmailAddress
    Properties:
      CodeUri: backend/
      Handler: lambda.notifyLowStock
      Environment:
        Variables:
          LOW_STOCK_TOPIC_ARN: !Ref LowStockTopic
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref LowStockTopic
      Events:
        ProductInventoryChanges:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ProductsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 3
            Enabled: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - lambda.ts
        Bundle: true
        Minify: true
        Target: es2022
        Format: esm

  CreateProductFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CreateProductFunction}'
      RetentionInDays: 7

  ListProductsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ListProductsFunction}'
      RetentionInDays: 7

  GetProductFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${GetProductFunction}'
      RetentionInDays: 7

  UpdateProductFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${UpdateProductFunction}'
      RetentionInDays: 7

  DeleteProductFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DeleteProductFunction}'
      RetentionInDays: 7

  CreateSaleFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CreateSaleFunction}'
      RetentionInDays: 7

  LowStockNotificationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasLowStockEmailAddress
    Properties:
      LogGroupName: !Sub '/aws/lambda/${LowStockNotificationFunction}'
      RetentionInDays: 7

Outputs:
  DeploymentRegion:
    Description: AWS region used by this stack.
    Value: !Ref AWS::Region
  ApiBaseUrl:
    Description: Base URL for the product API.
    Value: !Sub 'https://${InventoryApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}'
  FrontendUrl:
    Description: HTTPS URL for the deployed frontend.
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucketName:
    Description: Private S3 bucket for frontend build artifacts.
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: CloudFront distribution ID for frontend cache invalidation.
    Value: !Ref FrontendDistribution
  ProductsTableName:
    Description: DynamoDB product table name.
    Value: !Ref ProductsTable
  SalesTableName:
    Description: DynamoDB sales table name.
    Value: !Ref SalesTable
  LowStockTopicArn:
    Description: SNS topic ARN for low-stock email alerts.
    Condition: HasLowStockEmailAddress
    Value: !Ref LowStockTopic
  CognitoAuthority:
    Description: OIDC issuer for the employee user pool.
    Value: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${EmployeeUserPool}'
  CognitoUserPoolId:
    Description: Cognito user pool ID for employee authentication.
    Value: !Ref EmployeeUserPool
  CognitoClientId:
    Description: Public app client ID for the frontend.
    Value: !Ref EmployeeUserPoolClient
  CognitoDomain:
    Description: Cognito managed-login domain.
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
